name: Rakshak DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  security:
    name: Rakshak Security Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # 1. Checkout Rakshak source code
      - name: Checkout Rakshak
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Python syntax check
      - name: Python syntax check
        run: |
          python -m compileall app

      # 5. Scan repository for secrets
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Scan source code and dependencies with Trivy
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # 7. Build Rakshak Docker image
      - name: Build Rakshak Docker image
        run: |
          docker build -t rakshak:ci .

      # 8. Scan Docker image with Trivy
      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rakshak:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # 9. Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 10. Tag and push Rakshak Docker image
      - name: Push Rakshak Docker image
        run: |
          docker tag rakshak:ci ghcr.io/iush114/rakshak:latest
          docker push ghcr.io/iush114/rakshak:latest