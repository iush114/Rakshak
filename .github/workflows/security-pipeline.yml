name: Rakshak DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  security:
    name: Rakshak Security Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Rakshak
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m compileall app

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Gitleaks JSON report
        continue-on-error: true
        run: |
          mkdir -p reports
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path reports/gitleaks-results.json \
            --exit-code 0

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: reports/trivy-results.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Build Rakshak Docker image
        run: |
          docker build -t rakshak:ci .

      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: rakshak:ci
          format: json
          output: reports/trivy-image-results.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Run Rakshak security analysis
        run: |
          python -m app.main

      - name: Upload Rakshak security report
        uses: actions/upload-artifact@v6
        with:
          name: rakshak-security-report
          path: reports/
          retention-days: 30

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Rakshak Docker image
        run: |
          docker tag rakshak:ci ghcr.io/iush114/rakshak:latest
          docker push ghcr.io/iush114/rakshak:latest